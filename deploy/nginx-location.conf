# Goes in /etc/nginx/snippets/ and is included from the site's server block.

# The editor is a large script; nginx compresses only HTML unless told.
gzip_types text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;
gzip_min_length 1024;
gzip_vary on;

location /api/ {
    limit_req  zone=playground burst=3 nodelay;
    limit_conn playground_conn 1;
    limit_req_status  429;
    limit_conn_status 429;

    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
}
